[package]
name = "manimrs-studio"
description = "ManimRS Studio: make the slides of your talks with Claude, one at a time"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
studio_agent.workspace = true
studio_engine.workspace = true
studio_shell.workspace = true

tauri = { version = "2", features = [] }
serde_json.workspace = true
# Local server: the MCP server Claude connects to and the videos for the panel.
axum = "0.8"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }
base64 = "0.23"
# The secret that only this app and its Claude session know, to talk to the local server.
getrandom = "0.3"
