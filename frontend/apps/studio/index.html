<header>
  <div class="brand"><svg class="i"><use href="#i-brand"/></svg>ManimRS Studio<span class="version" id="version" title="This is a version before 1.0: the app and its files can change">Pre-release</span></div>
  <select id="talk" aria-label="Talk"></select>
  <button class="btn icon subtle" id="talk-details" title="Talk details" aria-label="Talk details"><svg class="i"><use href="#i-info"/></svg></button>
  <span class="summary" id="summary" title="Slides with an up to date video"></span>
  <span class="spacer"></span>
  <span class="field-label" id="quality-label">Resolution</span>
  <div class="segment" id="quality" role="group" aria-labelledby="quality-label"
       title="The talk's resolution: used by the slides that don't have one of their own">
    <button data-q="480p">480p</button>
    <button data-q="720p">720p</button>
    <button data-q="1080p">1080p</button>
  </div>
  <button class="btn" id="send-all" hidden></button>
  <button class="btn primary" id="pending"></button>
  <button class="btn" id="present"><svg class="i"><use href="#i-play"/></svg>Present</button>
  <div class="menu" id="export-menu">
    <button class="btn" id="export" aria-haspopup="menu" aria-expanded="false"><svg class="i"><use href="#i-export"/></svg>Export<svg class="i i-small"><use href="#i-down"/></svg></button>
    <div class="menu-list" role="menu">
      <button role="menuitem" data-f="html">HTML folder (.zip)<small>Opens in any browser, nothing to install</small></button>
      <button role="menuitem" data-f="pdf">PDF (.pdf)<small>One page for each pause, at its end</small></button>
      <button role="menuitem" data-f="mp4">Video (.mp4)<small>All the slides in one video, without pauses</small></button>
      <button role="menuitem" data-f="folder">Open the exports folder</button>
      <hr>
      <button role="menuitem" data-f="all">Render the whole talk<small>Slow: every slide</small></button>
    </div>
  </div>
</header>

<main>
  <aside aria-label="Slides">
    <div class="list-head">
      <h2>Slides</h2>
      <button class="btn" id="new" title="Add a slide after the selected one"><svg class="i"><use href="#i-plus"/></svg>New</button>
    </div>
    <div class="filters" id="filters" role="tablist" aria-label="Filter slides"></div>
    <div id="list" role="listbox" aria-label="Slides in the order of the talk"></div>
  </aside>
  <section id="viewer" aria-live="polite"></section>
  <div id="divider" role="separator" aria-orientation="vertical" aria-label="Change the width of the Claude panel"></div>
  <section id="claude" aria-label="Claude">
    <div class="claude-bar">
      <span class="c-title" id="c-title">New conversation</span>
      <span class="spacer"></span>
      <button class="btn icon subtle" id="c-history" title="Past conversations" aria-label="Past conversations" aria-haspopup="menu"><svg class="i"><use href="#i-history"/></svg></button>
      <button class="btn icon subtle" id="c-new" title="New conversation" aria-label="New conversation"><svg class="i"><use href="#i-plus"/></svg></button>
      <button class="btn icon subtle" id="c-settings" title="Chat settings" aria-label="Chat settings" aria-haspopup="menu"><svg class="i"><use href="#i-gear"/></svg></button>
    </div>
    <div class="floating-menu wide" id="c-history-menu" role="menu" hidden></div>
    <div class="floating-menu" id="c-settings-menu" role="menu" hidden></div>
    <div id="chat" role="log" aria-live="polite"></div>
    <div id="c-sheet" class="c-sheet" role="dialog" aria-labelledby="c-sheet-title" hidden>
      <div class="sheet-head">
        <button class="btn icon subtle" id="c-sheet-back" aria-label="Back to the conversation" title="Back to the conversation"><svg class="i"><use href="#i-left"/></svg></button>
        <b id="c-sheet-title"></b>
      </div>
      <div class="sheet-body" id="c-sheet-body"></div>
    </div>
    <form id="composer" autocomplete="off">
      <div id="c-popover" class="c-popover" role="listbox" hidden></div>
      <div id="c-palette" class="c-palette" role="dialog" aria-label="Actions" hidden>
        <input type="text" id="c-palette-filter" placeholder="Filter actions…" aria-label="Filter actions">
        <div id="c-palette-list" role="listbox"></div>
      </div>
      <div class="c-box">
        <div id="c-attachments" class="c-attachments" hidden></div>
        <textarea id="c-input" rows="1" placeholder="Ask Claude to make or change slides, @ mentions a file, / runs a command" aria-label="Message to Claude"></textarea>
        <div class="c-toolbar">
          <button type="button" class="btn icon subtle" id="c-attach" title="Attach a file" aria-label="Attach a file"><svg class="i"><use href="#i-plus"/></svg></button>
          <button type="button" class="btn icon subtle" id="c-actions" title="Actions and commands (Ctrl+/)" aria-label="Actions and commands" aria-haspopup="dialog"><svg class="i"><use href="#i-slash"/></svg></button>
          <button type="button" class="chip-btn" id="c-model" title="Model" aria-haspopup="menu"></button>
          <button type="button" class="chip-btn" id="c-effort" title="Effort" aria-haspopup="menu"></button>
          <span class="spacer"></span>
          <span class="c-context" id="c-context" hidden></span>
          <input type="file" id="c-file" multiple hidden>
          <button type="submit" class="c-send" id="c-send" aria-label="Send"><svg class="i"><use href="#i-arrow-up"/></svg></button>
        </div>
      </div>
    </form>
    <div class="floating-menu" id="c-choice-menu" role="menu" hidden></div>
  </section>
</main>

<footer>
  <div id="job"></div>
  <button class="btn subtle" id="show-log" aria-expanded="false"><svg class="i"><use href="#i-log"/></svg>Log</button>
  <span class="hint shortcuts"><span><kbd>↑</kbd><kbd>↓</kbd> change slide</span><span><kbd>←</kbd><kbd>→</kbd> pause</span><span><kbd>Space</kbd> play</span><span>drag to reorder</span></span>
</footer>
<div id="log" role="log" aria-label="Job log"></div>
<div id="slide-menu" class="floating-menu" role="menu" hidden></div>
<div id="toast" role="status"></div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<!-- build:scripts -->
</body>
</html>
