[package]
name = "manimrs-studio"
version = "0.5.0"
description = "ManimRS Studio: make the slides of your talks with Claude, one at a time"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local server: the MCP server Claude connects to and the videos for the panel.
axum = "0.8"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }
base64 = "0.23"
# The secret that only this app and its Claude session know, to talk to the local server.
getrandom = "0.3"
# The Windows folder picker, to create a talk where the user wants or open one from anywhere.
# Pinned: 0.18 was published a day before this was written.
rfd = { version = "=0.17.2", default-features = false }

[target.'cfg(windows)'.dependencies]
# Opening links and folders with the shell (never through cmd) and the startup error message.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
