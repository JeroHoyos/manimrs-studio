site_name: ManimRS Studio
site_description: Make Manim Slides talks one slide at a time, with Claude.
docs_dir: docs

theme:
  name: material
  palette:
    scheme: default
    primary: white
    accent: blue
  features:
    - content.code.copy

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage guide: usage-guide.md
  - Talks: talks.md
  - Claude chat: claude-chat.md
  - Web panel: web-panel.md
  - Command reference: cli-reference.md
  - How it works: how-it-works.md
  - Documentation style: writing-style.md

markdown_extensions:
  - tables
  - pymdownx.superfences
